# dsh-canvas-tsx-sidebar bundle patch
#
# Assembly layer for the DSH profiles whose bundle list includes this package.
# A pure addition: one insert row with an id no shipped entry uses. No shipped
# row is disabled, renamed, or reconfigured here.
#
# 安装方式（推荐，官方 CLI）：
#   dsh plugin --profile <profile> add <dsh-canvas-tsx-sidebar-0.2.0.tgz>
#
# 手动方式（备选）：把本包复制到 ~/.dsh/profiles/<profile>/node_modules/，
# 并把下面这行追加到该 profile 的 cordis.patch.yml。
#
# 注意：两种方式二选一，勿重复注册。
- insert:
    - id: dsh-canvas-tsx-sidebar
      name: dsh-canvas-tsx-sidebar
