# pnpm 10+ 默认拦截依赖的安装脚本，这里显式表态：
# esbuild —— tsdown 的底层打包器，二进制缺失则构建直接失败，必须放行。
# node-pty —— 传递依赖带来的原生模块，本插件不申请任何终端能力，明确拒绝构建。
allowBuilds:
  esbuild: true
  node-pty: false
# pnpm 12 的供应链年龄门会把刚发布的 locale rc 钉回旧版；
# 显式豁免本线实装版本，保证新机重解析时 peer 落在目标线（同族 brief-sidebar 惯例）。
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-client-locale@0.2.0-rc.1'
